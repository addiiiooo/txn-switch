spring:
  application:
    name: txn-switch
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/txnswitch}
    username: ${DB_USERNAME:txnswitch}
    password: ${DB_PASSWORD:txnswitch}
    hikari:
      # The pool bounds how much database work can be in flight. It is small on purpose:
      # no transaction in this service spans a network call, so connections are held for
      # microseconds and a large pool would only hide a mistake.
      maximum-pool-size: ${DB_POOL_SIZE:10}
      connection-timeout: 3000
      pool-name: txn-switch-pool
  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema. Hibernate's job is to notice when the mapping and the
      # migration have drifted apart, and to refuse to start when they have.
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    deserialization:
      # Jackson truncates a JSON float into an integer field by default, so `12.50` would
      # silently become 12 minor units. A client sending 12.50 means something we do not
      # accept, and quietly agreeing with a 100x error is how money bugs ship.
      accept-float-as-int: false

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
  health:
    # Liveness deliberately excludes the database: a process that is fine should not be
    # restarted because a dependency it cannot fix is down. Readiness includes it, so the
    # instance is taken out of rotation instead.
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

logging:
  level:
    root: INFO

txnswitch:
  authorization:
    # How long a hold survives before it expires. Seven days is the usual card-scheme
    # ballpark; it is configuration because it is a business decision, not a constant.
    hold-ttl: ${AUTH_HOLD_TTL:P7D}
    # A switch is certified per currency. This is a different question from "is this a
    # valid ISO-4217 code", which java.util.Currency already answers.
    supported-currencies: ${SUPPORTED_CURRENCIES:USD,EUR,GBP,JPY,INR}
    expiry-sweep-batch-size: 200
  idempotency:
    ttl: ${IDEMPOTENCY_TTL:PT24H}
    # Comfortably longer than the ~2.5s worst-case downstream budget, so a lease lapses
    # only when the holder is genuinely gone.
    lease-ttl: ${IDEMPOTENCY_LEASE_TTL:PT30S}
    unresolved-grace: ${IDEMPOTENCY_UNRESOLVED_GRACE:PT5M}
    purge-batch-size: 500
  security:
    # key:merchantId pairs. The default is a published development credential and the
    # application says so at startup outside the local profile. No secret is committed.
    api-keys: ${API_KEYS:sk_local_demo:m_demo,sk_local_other:m_other}
    card-fingerprint-key: ${CARD_FINGERPRINT_KEY:local-development-key-not-a-secret}
  problem:
    # Configuration, not a constant: pinning the error contract to one repository's branch
    # would make every previously emitted `type` a dead link if the project moved.
    type-base-uri: ${PROBLEM_TYPE_BASE_URI:https://github.com/addiiiooo/txn-switch/blob/main/docs/errors.md#}
  acquirer:
    name: ${ACQUIRER_NAME:sim-acquirer}
    # `self` points at the bundled simulator on whatever port this instance bound to.
    # Point it at a real acquirer and switch the simulator off.
    base-url: ${ACQUIRER_BASE_URL:self}
    connect-timeout: ${ACQUIRER_CONNECT_TIMEOUT:300ms}
    read-timeout: ${ACQUIRER_READ_TIMEOUT:800ms}
  simulator:
    enabled: ${SIMULATOR_ENABLED:true}

resilience4j:
  retry:
    instances:
      acquirer:
        # Three attempts at 800ms each plus jittered backoff: a worst case of about 2.5s,
        # which is the number the lease TTL is set against.
        max-attempts: 3
        wait-duration: 50ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        exponential-max-wait-duration: 400ms
        enable-randomized-wait: true
        randomized-wait-factor: 0.5
        # Retrying a read timeout is safe ONLY because every call carries the pre-allocated
        # authorization id as the acquirer's idempotency key (ADR-0001, ADR-0004).
        retry-exceptions:
          - com.txnswitch.application.port.AcquirerTimeoutException
          - com.txnswitch.application.port.AcquirerUnavailableException
        ignore-exceptions:
          # A malformed-request answer will be malformed again. An open breaker must fail
          # fast, not sleep through three backoffs.
          - com.txnswitch.application.port.AcquirerProtocolException
          - io.github.resilience4j.circuitbreaker.CallNotPermittedException
  circuitbreaker:
    instances:
      acquirer:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 20
        minimum-number-of-calls: 10
        failure-rate-threshold: 50
        # An acquirer answering in over a second is down for our purposes.
        slow-call-rate-threshold: 50
        slow-call-duration-threshold: 1s
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
        register-health-indicator: false
        record-exceptions:
          - com.txnswitch.application.port.AcquirerTimeoutException
          - com.txnswitch.application.port.AcquirerUnavailableException
        ignore-exceptions:
          # Our bug or theirs, but not an outage: it must not trip the breaker for everyone.
          - com.txnswitch.application.port.AcquirerProtocolException
