spring:
  application:
    name: txn-switch
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/txnswitch}
    username: ${DB_USERNAME:txnswitch}
    password: ${DB_PASSWORD:txnswitch}
    hikari:
      # The pool bounds how much database work can be in flight. It is small on purpose:
      # no transaction in this service spans a network call, so connections are held for
      # microseconds and a large pool would only hide a mistake.
      maximum-pool-size: ${DB_POOL_SIZE:10}
      connection-timeout: 3000
      pool-name: txn-switch-pool
  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema. Hibernate's job is to notice when the mapping and the
      # migration have drifted apart, and to refuse to start when they have.
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
  health:
    # Liveness deliberately excludes the database: a process that is fine should not be
    # restarted because a dependency it cannot fix is down. Readiness includes it, so the
    # instance is taken out of rotation instead.
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

logging:
  level:
    root: INFO
